version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: cleo_postgres
    environment:
      POSTGRES_USER: cleo
      POSTGRES_PASSWORD: cleo_password
      POSTGRES_DB: cleo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cleo_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cleo_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cleo_network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cleo_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cleo
      RABBITMQ_DEFAULT_PASS: cleo_password
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cleo_network

  # User Service
  user-service:
    build:
      context: ./backend/services/user-service
      dockerfile: Dockerfile
    container_name: cleo_user_service
    environment:
      - DATABASE_URL=postgresql+asyncpg://cleo:cleo_password@postgres:5432/cleo_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
      - ENVIRONMENT=development
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/services/user-service:/app
      - ./backend/shared:/app/shared
    networks:
      - cleo_network
    restart: unless-stopped

  # Banking Service (Plaid integration)
  banking-service:
    build:
      context: ./backend/services/banking-service
      dockerfile: Dockerfile
    container_name: cleo_banking_service
    environment:
      - DATABASE_URL=postgresql+asyncpg://cleo:cleo_password@postgres:5432/cleo_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - PLAID_ENV=sandbox
      - DEBUG=true
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/services/banking-service:/app
      - ./backend/shared:/app/shared
    networks:
      - cleo_network
    restart: unless-stopped

  # Budget Service
  budget-service:
    build:
      context: ./backend/services/budget-service
      dockerfile: Dockerfile
    container_name: cleo_budget_service
    environment:
      - DATABASE_URL=postgresql+asyncpg://cleo:cleo_password@postgres:5432/cleo_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/services/budget-service:/app
      - ./backend/shared:/app/shared
    networks:
      - cleo_network
    restart: unless-stopped

  # Chat Service (AI)
  chat-service:
    build:
      context: ./backend/services/chat-service
      dockerfile: Dockerfile
    container_name: cleo_chat_service
    environment:
      - DATABASE_URL=postgresql+asyncpg://cleo:cleo_password@postgres:5432/cleo_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEBUG=true
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/services/chat-service:/app
      - ./backend/shared:/app/shared
      - ./ml:/app/ml
    networks:
      - cleo_network
    restart: unless-stopped

  # API Gateway (Kong)
  kong-database:
    image: postgres:14-alpine
    container_name: cleo_kong_db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_password
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - cleo_network

  kong-migrations:
    image: kong:3.4-alpine
    container_name: cleo_kong_migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PG_DATABASE: kong
    depends_on:
      - kong-database
    networks:
      - cleo_network

  kong:
    image: kong:3.4-alpine
    container_name: cleo_kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"  # Proxy port
      - "8444:8444"  # Proxy SSL port
      - "8002:8001"  # Admin API (note: different from user-service port)
    depends_on:
      - kong-database
      - kong-migrations
    networks:
      - cleo_network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  # pgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cleo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cleo.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - cleo_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kong_data:
  pgadmin_data:

networks:
  cleo_network:
    driver: bridge
